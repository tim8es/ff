name: FF owner Qwen3 1.7B MP4 one-off acceptance
on:
  push:
    branches: [feature/actions-mp4-production]
    paths:
      - 'staging/episode.zip.b64'
permissions:
  contents: read
jobs:
  owner-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Preflight encrypted reference and staged episode
        env:
          FF_VOICE_BUNDLE_KEY: ${{ secrets.FF_VOICE_BUNDLE_KEY }}
        run: |
          test -n "$FF_VOICE_BUNDLE_KEY"
          test -s staging/episode.zip.b64
          test -s .private_voice/reference.bundle.b64
          base64 --decode .private_voice/reference.bundle.b64 > "$RUNNER_TEMP/reference.bundle"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install FF video and Qwen CPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install "Pillow>=10.4,<13" "numpy>=1.26,<3" "soundfile>=0.12,<1" cryptography
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install qwen-tts
      - name: Produce RU MP4 with encrypted owner reference
        env:
          FF_VOICE_BUNDLE_KEY: ${{ secrets.FF_VOICE_BUNDLE_KEY }}
        run: |
          python -m scripts.production build --bundle staging/episode.zip.b64 --voice-mode owner --encrypted-reference "$RUNNER_TEMP/reference.bundle" --workspace out
          python -m scripts.production seal --workspace out --output "$RUNNER_TEMP/encrypted_video.bundle"
          rm -rf out "$RUNNER_TEMP/reference.bundle"
      - name: Purge plaintext even on synthesis failure
        if: always()
        run: rm -rf out "$RUNNER_TEMP/reference.bundle"
      - name: Upload encrypted video only
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ff-owner-qwen17-mp4-encrypted
          path: ${{ runner.temp }}/encrypted_video.bundle
          retention-days: 1
          if-no-files-found: error
