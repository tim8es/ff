name: FF MP4 acceptance test (temporary)
on:
  push:
    branches: [feature/actions-mp4-production]
    paths: ['.github/workflows/production-acceptance.yml']
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: FFmpeg and Piper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install 'Pillow>=10.4,<13' 'numpy>=1.26,<3' 'soundfile>=0.12,<1' 'piper-tts==1.8.0'
      - name: Produce technical review-required preview
        run: |
          python -m scripts.production build --demo --workspace out
          ffprobe -v error -show_entries format=duration -of json out/final.mp4
      - uses: actions/upload-artifact@v5
        with:
          name: ff-mp4-pipeline-technical-demo
          path: |
            out/final.mp4
            out/qa.json
            out/handoff.json
          retention-days: 3
