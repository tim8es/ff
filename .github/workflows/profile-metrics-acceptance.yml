name: FF temporary profile and metrics acceptance
on:
  push:
    branches: [feature/ci-profile-metrics-20261101]
    paths: [".github/workflows/profile-metrics-acceptance.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU neural runtime
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install qwen-tts soundfile numpy
      - name: Get public reference, no personal voice
        run: |
          mkdir -p demo out
          python - <<'PY'
          from urllib.request import urlretrieve
          from pathlib import Path
          urlretrieve("https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen3-TTS-Repo/clone.wav", "demo/ref.wav")
          Path("demo/ref.txt").write_text("Okay. Yeah. I resent you. I love you. I respect you. But you know what? You blew it! And thanks to you.",encoding="utf8")
          Path("demo/ru.txt").write_text("Предки акул появились раньше первых лесов.", encoding="utf8")
          Path("demo/en.txt").write_text("Some sharks appeared long before the first forests.",encoding="utf8")
          PY
      - name: Produce bilingual Qwen voice with named profile
        run: |
          python -m scripts.qwen_batch --profile ff_owner \
            --reference demo/ref.wav --reference-text-file demo/ref.txt \
            --ru demo/ru.txt --en demo/en.txt --output-dir out
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          report=json.loads(Path("out/tts_performance.json").read_text())
          assert report["profile"]=="ff_owner"
          assert report["model"]=="Qwen/Qwen3-TTS-12Hz-1.7B-Base"
          for k in ("model_load_including_download_s","voice_conditioning_s","ru_synthesis_and_audio_write_s","en_synthesis_and_audio_write_s","total_s","peak_process_rss_mib"):
              assert k in report["phases"], k
          for lang in ("ru","en"):
              wav=Path("out")/f"qwen_{lang}.wav"
              meta=json.loads(wav.with_suffix(".voice.json").read_text())
              assert meta["audio_sha256"] == hashlib.sha256(wav.read_bytes()).hexdigest()
              assert meta["model"] == report["model"]
          print("PASS profile, two WAVs, receipts and measured phases")
          PY
          for f in out/*.wav; do ffmpeg -v error -xerror -i "$f" -f null -; done
      - uses: actions/upload-artifact@v5
        with:
          name: ff-public-profile-acceptance
          path: |
            out/tts_performance.json
            out/*.voice.json
          retention-days: 2
