name: FF temporary Qwen batch acceptance
on:
  push:
    branches: [feature/actions-efficiency-20261101]
    paths: [".github/workflows/qwen-batch-acceptance.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: CPU-only neural dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install qwen-tts soundfile numpy
      - name: Prepare upstream public voice and bilingual text
        run: |
          mkdir -p demo out
          python - <<'PY'
          from urllib.request import urlretrieve
          from pathlib import Path
          urlretrieve("https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen3-TTS-Repo/clone.wav", "demo/ref.wav")
          Path("demo/ref.txt").write_text("Okay. Yeah. I resent you. I love you. I respect you. But you know what? You blew it! And thanks to you.", encoding="utf8")
          Path("demo/ru.txt").write_text("Предки акул появились раньше первых лесов.", encoding="utf8")
          Path("demo/en.txt").write_text("Some sharks appeared long before the first forests.", encoding="utf8")
          PY
      - name: Verify one model load for RU and EN with real synthesis
        run: |
          python -m scripts.qwen_batch --model-size 1.7B \
            --reference demo/ref.wav --reference-text-file demo/ref.txt \
            --ru demo/ru.txt --en demo/en.txt --output-dir out
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          for lang in ("ru", "en"):
              wav = Path("out") / ("qwen_" + lang + ".wav")
              receipt = json.loads(wav.with_suffix(".voice.json").read_text())
              assert receipt["language"] == lang, receipt
              assert receipt["model"] == "Qwen/Qwen3-TTS-12Hz-1.7B-Base", receipt
              assert receipt["audio_sha256"] == hashlib.sha256(wav.read_bytes()).hexdigest()
              assert receipt["text_sha256"] == hashlib.sha256(Path("demo", lang + ".txt").read_text().encode()).hexdigest()
              print("PASS",lang,receipt["duration"])
          PY
          for file in out/*.wav; do ffmpeg -v error -xerror -i "$file" -f null -; done
