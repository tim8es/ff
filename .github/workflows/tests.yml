name: FF renderer checks
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the latest checks for a branch/PR. Never cancel production renders.
concurrency:
  group: ff-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Ensure FFmpeg exists
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Install small test dependencies
        run: python -m pip install -r scripts/requirements.txt cryptography
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
